<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <style>
        /* 1. Плавний перехід між секціями */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf5e6;
            color: #3e2723;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #4e342e;
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffb300;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        /* 2. Секція з чашкою та парою */
        #hero {
            background-color: #d7ccc8;
        }

        .cup-container {
            position: relative;
            margin-top: 50px;
        }

        .cup {
            width: 120px;
            height: 100px;
            background-color: #fff;
            border-radius: 5px 5px 50px 50px;
            position: relative;
            border: 4px solid #3e2723;
            z-index: 2;
        }

        .cup-handle {
            position: absolute;
            right: -30px;
            top: 20px;
            width: 40px;
            height: 50px;
            border: 4px solid #3e2723;
            border-radius: 50%;
            z-index: 1;
        }

        .steam-area {
            position: absolute;
            top: -100px;
            left: 20px;
            width: 80px;
            height: 100px;
        }

        /* Анімація окремої частинки пари (CSS) */
        .steam-particle {
            position: absolute;
            bottom: 0;
            width: 15px;
            height: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: rise 2s ease-in forwards;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(3); opacity: 0; }
        }

        .controls {
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            background-color: #795548;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5d4037;
        }

        /* 3. Секція меню (Анімація появи) */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .menu-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item {
            padding: 20px;
            background-color: #fff;
            border: 2px solid #8d6e63;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .menu-item:hover {
            transform: scale(1.1);
            background-color: #efebe9;
        }

        #drink-details {
            padding: 20px;
            width: 300px;
            background-color: #ffecb3;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            border: 2px dashed #ffb300;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#hero">Головна</a>
        <a href="#menu-section">Меню</a>
    </nav>

    <!-- Секція 1: Анімація пари -->
    <section id="hero">
        <h1>Ласкаво просимо до Coffee House</h1>
        <div class="cup-container">
            <div class="steam-area" id="steam-area"></div>
            <div class="cup">
                <div class="cup-handle"></div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-start-steam">Увімкнути пару</button>
            <button id="btn-stop-steam">Вимкнути пару</button>
        </div>
    </section>

    <!-- Секція 2: Меню при прокручуванні -->
    <section id="menu-section" class="scroll-reveal">
        <h2>Наше Інтерактивне Меню</h2>
        <p>Оберіть напій, щоб дізнатися деталі:</p>
        
        <div class="menu-grid">
            <div class="menu-item" data-name="Еспресо" data-price="45 грн" data-desc="Міцний і насичений кавовий шот.">Еспресо</div>
            <div class="menu-item" data-name="Капучино" data-price="65 грн" data-desc="Ідеальний баланс еспресо, гарячого молока та густої пінки.">Капучино</div>
            <div class="menu-item" data-name="Латте" data-price="75 грн" data-desc="Багато теплого молока з ніжним кавовим смаком.">Латте</div>
        </div>

        <div id="drink-details">
            Тут з'явиться інформація про обраний напій.
        </div>
    </section>

    <script>
        // ---------------------------------------------------------
        // ЧАСТИНА 1: Керування анімацією пари
        // ---------------------------------------------------------
        const steamArea = document.getElementById('steam-area');
        const btnStartSteam = document.getElementById('btn-start-steam');
        const btnStopSteam = document.getElementById('btn-stop-steam');
        
        let steamIntervalId = null;

        // Функція для створення однієї хмаринки пари
        function createSteamParticle() {
            const particle = document.createElement('div');
            particle.classList.add('steam-particle');
            
            // Випадкова позиція по горизонталі від 0 до 65px (ширина області мінус ширина частинки)
            const randomLeft = Math.floor(Math.random() * 65);
            particle.style.left = randomLeft + 'px';
            
            // Додаємо частинку в DOM
            steamArea.appendChild(particle);
            
            // Видаляємо частинку через 2 секунди (час закінчення CSS-анімації 'rise')
            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // Запуск генерації пари
        btnStartSteam.addEventListener('click', () => {
            if (!steamIntervalId) {
                // Створювати нову частинку кожні 300 мілісекунд
                steamIntervalId = setInterval(createSteamParticle, 300);
            }
        });

        // Зупинка генерації пари
        btnStopSteam.addEventListener('click', () => {
            clearInterval(steamIntervalId);
            steamIntervalId = null; // Скидаємо ID, щоб можна було запустити знову
        });

        // ---------------------------------------------------------
        // ЧАСТИНА 2: Поява меню при прокручуванні
        // ---------------------------------------------------------
        const revealElements = document.querySelectorAll('.scroll-reveal');

        // Налаштування "спостерігача" за видимістю елементів
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.3 }); // Спрацьовує, коли видно хоча б 30% блоку

        // Передаємо всі елементи, які треба анімувати, до спостерігача
        revealElements.forEach(el => revealObserver.observe(el));

        // ---------------------------------------------------------
        // ЧАСТИНА 3: Інтерактивне меню напоїв
        // ---------------------------------------------------------
        const menuItems = document.querySelectorAll('.menu-item');
        const drinkDetails = document.getElementById('drink-details');

        menuItems.forEach(item => {
            item.addEventListener('click', (event) => {
                // Зчитуємо дані з HTML-атрибутів data-*
                const name = event.target.getAttribute('data-name');
                const price = event.target.getAttribute('data-price');
                const desc = event.target.getAttribute('data-desc');

                // Оновлюємо текст інформаційного блоку, використовуючи шаблонні рядки
                drinkDetails.innerHTML = `
                    <h3>${name}</h3>
                    <p><strong>Ціна:</strong> ${price}</p>
                    <p>${desc}</p>
                `;
            });
        });
    </script>
</body>
</html>
